<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Way2GO</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Open+Sans&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="font-[Open+Sans] bg-[#f9f6f1] text-[#444]">


  <!-- Header -->
  <header class="bg-white py-6 px-10 flex justify-between items-center border-b border-gray-200">
    <h1 class="text-2xl font-bold font-[Playfair+Display] text-[#2c3e50]">Way2GO</h1>
  </header>


  <!-- Hero Section -->
  <section class="relative bg-cover bg-center h-[50vh] flex items-center justify-center text-center text-white mb-12" style="background-image: url('static\images\2NDPAGEBG.jpg')">
    <div class="absolute inset-0 bg-black bg-opacity-50 z-0"></div>
    <div class="relative z-10 px-4">
      <h2 class="text-3xl font-[Playfair+Display] mb-3 text-[#f9f6f1] drop-shadow">Explore Our Premier Resorts</h2>
      <p class="text-md max-w-xl mx-auto text-[#f9f6f1] drop-shadow">Handpicked destinations across Batangas for your next elegant escape.</p>
    </div>
  </section>


  <!-- Resorts Gallery -->
  <section class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-8 max-w-6xl mx-auto my-12 px-6">
    {% for resort in resorts %}
    <a href="/resort-details?resort={{ resort.slug }}" class="bg-white rounded-xl shadow-md hover:shadow-lg transition">
      <img src="{{ resort.image_url }}" alt="{{ resort.name }}" class="w-full h-48 object-cover">
      <div class="p-4">
        <p class="text-lg font-semibold text-[#2c3e50]">{{ resort.name }}</p>
        {% if resort.is_pet_friendly %}
          <div class="mt-2 flex items-center justify-center">
            <span class="bg-green-100 text-green-800 text-xs font-medium px-2.5 py-0.5 rounded flex items-center">
              <svg class="h-4 w-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
              </svg>
              Pet Friendly
            </span>
          </div>
        {% endif %}
        <p class="text-sm text-gray-500 mt-2">{{ resort.description }}</p>
      </div>
    </a>
    {% endfor %}
  </section>

  <!-- Footer -->
  <footer class="bg-[#2c3e50] text-white text-center py-6 text-sm mt-12">
    <p>&copy; 2025 Way2GO Travel. All rights reserved.</p>
  </footer>


</body>
</html>
